<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
          content="Emotion Detector — analyze text for joy, anger, sadness, fear, and disgust using IBM Watson NLP.">
    <title>Emotion Detector — Final Project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            color: #e0e0f0;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 700px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.4rem;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            font-size: 0.9rem;
            color: #9ca3af;
            margin-bottom: 2rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #c4b5fd;
            font-size: 0.95rem;
        }

        textarea {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(167, 139, 250, 0.35);
            background: rgba(255, 255, 255, 0.06);
            color: #e0e0f0;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
            min-height: 110px;
        }

        textarea:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.2);
        }

        textarea::placeholder { color: #6b7280; }

        button {
            margin-top: 1.2rem;
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #7c3aed, #2563eb);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            letter-spacing: 0.02em;
        }

        button:hover { opacity: 0.88; transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        #system_response {
            margin-top: 1.8rem;
        }

        .result-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 1.4rem 1.6rem;
        }

        .result-box h2 {
            font-size: 1.05rem;
            font-weight: 600;
            color: #a78bfa;
            margin-bottom: 1rem;
        }

        .emotion-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.2rem;
        }

        .emotion-chip {
            background: rgba(167, 139, 250, 0.12);
            border: 1px solid rgba(167, 139, 250, 0.25);
            border-radius: 10px;
            padding: 0.55rem 0.8rem;
            text-align: center;
        }

        .emotion-chip .label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #9ca3af;
            margin-bottom: 0.25rem;
        }

        .emotion-chip .value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #e0e0f0;
        }

        .dominant-banner {
            background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(37,99,235,0.3));
            border: 1px solid rgba(167,139,250,0.4);
            border-radius: 10px;
            padding: 0.7rem 1rem;
            font-size: 1rem;
            font-weight: 600;
            color: #e9d5ff;
            text-align: center;
        }

        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 14px;
            padding: 1rem 1.4rem;
            color: #fca5a5;
            font-size: 0.95rem;
        }

        .loading {
            text-align: center;
            color: #9ca3af;
            font-size: 0.95rem;
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Emotion Detector</h1>
        <p class="subtitle">Powered by IBM Watson NLP · Final Project</p>

        <label for="textToAnalyze">Enter text to analyze:</label>
        <textarea id="textToAnalyze"
                  name="textToAnalyze"
                  rows="5"
                  placeholder="Type a sentence, e.g. "I am glad this happened"…"></textarea>

        <button id="analyzeBtn" type="button" onclick="RunSentimentAnalysis()">
            Analyze Emotion
        </button>

        <div id="system_response"></div>
    </div>

    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
